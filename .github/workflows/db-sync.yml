name: Sync Supabase schema

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch: {}

jobs:
  db-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # A personal push (not GITHUB_TOKEN's default identity) so the
          # follow-up commit below can trigger other workflows normally.
          fetch-depth: 0

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push migrations to Supabase
        run: supabase db push --db-url "$SUPABASE_DB_URL"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Regenerate TypeScript types from the live schema
        run: supabase gen types typescript --db-url "$SUPABASE_DB_URL" > src/integrations/supabase/types.ts
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Commit updated types if they changed
        run: |
          if ! git diff --quiet -- src/integrations/supabase/types.ts; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add src/integrations/supabase/types.ts
            git commit -m "chore: regenerate Supabase types after migration [skip ci]"
            git push
          fi
