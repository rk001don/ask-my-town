name: CI

# Nothing gated pull requests before this: db-sync ran on main only, so a PR
# could be merged with a type error, a lint failure or a broken build and the
# first sign of trouble was the production deploy.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  # A new push supersedes the run in flight for the same ref.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    # Needs real Supabase credentials to render the catalogue, so it is skipped
    # on forks where secrets are unavailable rather than failing misleadingly.
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Deliberately no Supabase env here. The connection values are the
      # publishable ones and live in the committed .env, which is what local
      # dev already reads. Passing them as secrets looked safer but was the
      # opposite: an unset secret expands to an EMPTY STRING and overrides the
      # .env value, so the client could not initialise, getSession() never
      # resolved, and every page sat in its loading skeleton until the test
      # timed out. Nine of ten tests failed that way on the first run.
      - name: Run end-to-end suite
        run: npm run e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
